short_bio: >-
  <p>
    I am a machine learning researcher interested in making learning systems
    more reliable, particularly through epistemic uncertainty estimation,
    safe reinforcement learning, and decision-making under uncertainty.
    My recent work, <a href="https://arxiv.org/abs/2605.01632" target="_blank">Perturb and Correct</a>
    (NeurIPS 2026), develops an efficient way to construct post-hoc ensembles
    from a single trained model.
  </p>
  <p>
    I earned my PhD in Computer Science from the University of Nebraska-Lincoln
    in December 2025, advised by Stephen Scott. Previously, I was a Research
    Scientist at <a href="https://www.phaidra.ai/" target="_blank">Phaidra</a>
    (2022–2025), working on machine learning and optimization for industrial control.
    I am seeking research scientist and research engineer opportunities, and welcome
    conversations about research and collaboration.
  </p>

