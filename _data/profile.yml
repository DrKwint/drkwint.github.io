short_bio: >-
  <p>
    I earned my PhD from the University of Nebraska-Lincoln in December 2025,
    studying safe and trustworthy reinforcement learning and machine learning,
    advised by Stephen Scott. My research spans verification, interpretability,
    generative models, and self-supervised learning, with applications in
    materials science, chemistry, robotics, computer security, and medicine.
  </p>
  <p>
    From 2022 to 2025 I was a Research Scientist at
    <a href="https://www.phaidra.ai/" target="_blank">Phaidra</a>, applying
    reinforcement learning to industrial control. I am currently open to new
    opportunities. Please feel free to reach out about collaboration or my work.
  </p>

